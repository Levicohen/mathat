<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>לוח מתמטיקה חכם לטאבלט</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="לוח מתמטיקה">
  <meta name="theme-color" content="#4f46e5">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; background-color: #f8fafc; }
    #drawingCanvas { touch-action: none; cursor: crosshair; display: block; }
    #scroller { overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
    .grid-math { background-size: 28px 28px; background-image: linear-gradient(to right, rgba(99,102,241,0.12) 1px, transparent 1px), linear-gradient(to bottom, rgba(99,102,241,0.12) 1px, transparent 1px); background-color: #f8fafc; }
    .solution-content { font-size: 1.1rem; line-height: 1.6; white-space: pre-wrap; }
    #sidebar::-webkit-scrollbar { width: 4px; }
    #sidebar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    #scroller::-webkit-scrollbar { width: 8px; }
    #scroller::-webkit-scrollbar-thumb { background: #a5b4fc; border-radius: 4px; }
  </style>
</head>
<body class="flex h-screen w-screen overflow-hidden select-none bg-slate-900 text-slate-800">

  <!-- משטח הכתיבה: אזור גלילה אנכי עם לוח גבוה -->
  <main class="relative flex-1 h-full overflow-hidden" id="canvasContainer">
    <div id="scroller" class="relative w-full h-full overflow-y-auto overflow-x-hidden">
      <canvas id="drawingCanvas" class="grid-math"></canvas>
      <div id="selBox" class="hidden absolute pointer-events-none border-2 border-dashed border-indigo-600 bg-indigo-500/5 rounded-lg" style="z-index:5"></div>
    </div>

    <div id="palmFloatingBadge" class="absolute top-4 left-4 z-20 bg-white/90 backdrop-blur px-3 py-1.5 rounded-2xl shadow-md border border-slate-200 flex items-center gap-2 pointer-events-none text-xs font-semibold text-emerald-700">
      <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
      <span id="badgeStatusText">עט בלבד פעיל</span>
    </div>
  </main>

  <aside id="sidebar" class="w-24 bg-white border-r border-slate-200 h-full flex flex-col items-center py-4 px-2 shadow-2xl z-40 overflow-y-auto gap-4">

    <div class="w-12 h-12 rounded-2xl bg-indigo-600 text-white flex items-center justify-center font-black text-xl shadow-md shrink-0">∑</div>

    <div class="flex flex-col gap-2 w-full">
      <button id="btnPen" class="w-full py-2.5 rounded-xl bg-indigo-50 text-indigo-600 font-bold border-2 border-indigo-600 flex flex-col items-center gap-1 text-xs shadow-sm cursor-pointer">
        <i class="fa-solid fa-pen text-base"></i><span>עט</span>
      </button>
      <button id="btnEraser" class="w-full py-2.5 rounded-xl text-slate-600 hover:bg-slate-100 font-medium flex flex-col items-center gap-1 text-xs transition-all cursor-pointer">
        <i class="fa-solid fa-eraser text-base"></i><span>מחק</span>
      </button>
    </div>

    <div class="w-full bg-slate-100 rounded-xl p-2 flex flex-col items-center gap-2 border border-slate-200">
      <div class="flex items-center justify-center gap-2 w-full">
        <button class="width-btn w-6 h-6 rounded-full flex items-center justify-center bg-white shadow-sm border-2 border-indigo-600 cursor-pointer" data-width="1.5"><span class="w-1.5 h-1.5 rounded-full bg-slate-800"></span></button>
        <button class="width-btn w-6 h-6 rounded-full flex items-center justify-center bg-transparent hover:bg-white cursor-pointer" data-width="3"><span class="w-2.5 h-2.5 rounded-full bg-slate-800"></span></button>
        <button class="width-btn w-6 h-6 rounded-full flex items-center justify-center bg-transparent hover:bg-white cursor-pointer" data-width="5"><span class="w-3.5 h-3.5 rounded-full bg-slate-800"></span></button>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-2 w-full px-1">
      <button class="color-dot w-7 h-7 rounded-full bg-slate-900 ring-2 ring-offset-2 ring-indigo-600 shadow-sm mx-auto cursor-pointer" data-color="#0f172a"></button>
      <button class="color-dot w-7 h-7 rounded-full bg-blue-600 shadow-sm mx-auto cursor-pointer" data-color="#2563eb"></button>
      <button class="color-dot w-7 h-7 rounded-full bg-emerald-600 shadow-sm mx-auto cursor-pointer" data-color="#059669"></button>
      <button class="color-dot w-7 h-7 rounded-full bg-rose-600
