<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>לוח מתמטיקה חכם לטאבלט</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="לוח מתמטיקה">
  <meta name="theme-color" content="#4f46e5">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.1/math.min.js"></script>

  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; background-color: #f8fafc; }
    #drawingCanvas { touch-action: none; cursor: crosshair; display: block; }
    #scroller { overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
    .grid-math { background-size: 28px 28px; background-image: linear-gradient(to right, rgba(99,102,241,0.12) 1px, transparent 1px), linear-gradient(to bottom, rgba(99,102,241,0.12) 1px, transparent 1px); background-color: #f8fafc; }
    .solution-content { font-size: 1.1rem; line-height: 1.6; white-space: pre-wrap; }
    #sidebar::-webkit-scrollbar { width: 4px; }
    #sidebar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    #scroller::-webkit-scrollbar { width: 8px; }
    #scroller::-webkit-scrollbar-thumb { background: #a5b4fc; border-radius: 4px; }
  </style>
</head>
<body class="flex h-screen w-screen overflow-hidden select-none bg-slate-900 text-slate-800">

  <!-- משטח הכתיבה: אזור גלילה אנכי עם לוח גבוה -->
  <main class="relative flex-1 h-full overflow-hidden" id="canvasContainer">
    <div id="scroller" class="relative w-full h-full overflow-y-auto overflow-x-hidden">
      <canvas id="drawingCanvas" class="grid-math"></canvas>
      <div id="selBox" class="hidden absolute pointer-events-none border-2 border-dashed border-indigo-600 bg-indigo-500/5 rounded-lg" style="z-index:5"></div>
    </div>

    <div id="palmFloatingBadge" class="absolute top-4 left-4 z-20 bg-white/90 backdrop-blur px-3 py-1.5 rounded-2xl shadow-md border border-slate-200 flex items-center gap-2 pointer-events-none text-xs font-semibold text-emerald-700">
      <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
      <span id="badgeStatusText">עט בלבד פעיל</span>
    </div>
  </main>

  <aside id="sidebar" class="w-24 bg-white border-r border-slate-200 h-full flex flex-col items-center py-4 px-2 shadow-2xl z-40 overflow-y-auto gap-4">

    <div class="w-12 h-12 rounded-2xl bg-indigo-600 text-white flex items-center justify-center font-black text-xl shadow-md shrink-0">∑</div>

    <div class="flex flex-col gap-2 w-full">
      <button id="btnPen" class="w-full py-2.5 rounded-xl bg-indigo-50 text-indigo-600 font-bold border-2 border-indigo-600 flex flex-col items-center gap-1 text-xs shadow-sm cursor-pointer">
        <i class="fa-solid fa-pen text-base"></i><span>עט</span>
      </button>
      <button id="btnEraser" class="w-full py-2.5 rounded-xl text-slate-600 hover:bg-slate-100 font-medium flex flex-col items-center gap-1 text-xs transition-all cursor-pointer">
        <i class="fa-solid fa-eraser text-base"></i><span>מחק</span>
      </button>
    </div>

    <div class="w-full bg-slate-100 rounded-xl p-2 flex flex-col items-center gap-2 border border-slate-200">
      <div class="flex items-center justify-center gap-2 w-full">
        <button class="width-btn w-6 h-6 rounded-full flex items-center justify-center bg-white shadow-sm border-2 border-indigo-600 cursor-pointer" data-width="1.5"><span class="w-1.5 h-1.5 rounded-full bg-slate-800"></span></button>
        <button class="width-btn w-6 h-6 rounded-full flex items-center justify-center bg-transparent hover:bg-white cursor-pointer" data-width="3"><span class="w-2.5 h-2.5 rounded-full bg-slate-800"></span></button>
        <button class="width-btn w-6 h-6 rounded-full flex items-center justify-center bg-transparent hover:bg-white cursor-pointer" data-width="5"><span class="w-3.5 h-3.5 rounded-full bg-slate-800"></span></button>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-2 w-full px-1">
      <button class="color-dot w-7 h-7 rounded-full bg-slate-900 ring-2 ring-offset-2 ring-indigo-600 shadow-sm mx-auto cursor-pointer" data-color="#0f172a"></button>
      <button class="color-dot w-7 h-7 rounded-full bg-blue-600 shadow-sm mx-auto cursor-pointer" data-color="#2563eb"></button>
      <button class="color-dot w-7 h-7 rounded-full bg-emerald-600 shadow-sm mx-auto cursor-pointer" data-color="#059669"></button>
      <button class="color-dot w-7 h-7 rounded-full bg-rose-600 shadow-sm mx-auto cursor-pointer" data-color="#e11d48"></button>
    </div>

    <div class="w-full flex flex-col gap-2">
      <button id="togglePalm" class="w-full py-2 px-1 rounded-xl bg-emerald-50 text-emerald-700 border border-emerald-300 flex flex-col items-center gap-1 text-[11px] font-bold cursor-pointer">
        <i class="fa-solid fa-hand text-sm"></i><span id="btnPalmText">עט בלבד</span>
      </button>

      <div class="flex items-center justify-between px-1 pt-1 w-full">
        <button id="btnUndo" class="p-2 text-slate-600 hover:bg-slate-200 rounded-xl cursor-pointer" title="בטל"><i class="fa-solid fa-rotate-left"></i></button>
        <button id="btnClear" class="p-2 text-rose-500 hover:bg-rose-100 rounded-xl cursor-pointer" title="נקה הכל"><i class="fa-solid fa-trash-can"></i></button>
      </div>

      <!-- ניווט בלוח -->
      <div class="flex items-center justify-between px-1 w-full">
        <button id="btnScrollUp" class="p-2 text-slate-600 hover:bg-slate-200 rounded-xl cursor-pointer" title="גלול למעלה"><i class="fa-solid fa-arrow-up"></i></button>
        <button id="btnScrollDown" class="p-2 text-slate-600 hover:bg-slate-200 rounded-xl cursor-pointer" title="גלול למטה"><i class="fa-solid fa-arrow-down"></i></button>
      </div>
      <button id="btnAddSpace" class="w-full py-2 rounded-xl bg-slate-100 text-slate-700 border border-slate-300 flex flex-col items-center gap-1 text-[11px] font-bold cursor-pointer active:scale-95">
        <i class="fa-solid fa-plus"></i><span>הוסף מקום</span>
      </button>
      <button id="btnSelect" class="w-full py-2 rounded-xl bg-slate-100 text-slate-700 border border-slate-300 flex flex-col items-center gap-1 text-[11px] font-bold cursor-pointer active:scale-95">
        <i class="fa-regular fa-square"></i><span id="btnSelectText">סמן תרגיל</span>
      </button>
    </div>

    <div class="flex flex-col items-center gap-3 w-full pt-3 mt-1 border-t border-slate-200">
      <button id="btnSettings" class="w-full py-2 rounded-xl bg-slate-100 text-slate-700 border border-slate-300 flex items-center justify-center gap-2 text-xs font-bold shadow-sm cursor-pointer active:scale-95">
        <i class="fa-solid fa-gear"></i><span>חיבור AI</span>
      </button>

      <button id="btnCheckSteps" class="w-full py-3 rounded-xl bg-gradient-to-b from-amber-500 to-amber-600 text-white font-extrabold text-xs shadow-lg flex flex-col items-center justify-center gap-1 active:scale-95 cursor-pointer">
        <i class="fa-solid fa-magnifying-glass"></i><span>בדוק שלבים</span>
      </button>

      <button id="btnCheckFull" class="w-full py-3 rounded-xl bg-gradient-to-b from-indigo-600 to-indigo-700 text-white font-black text-xs shadow-lg flex flex-col items-center justify-center gap-1 active:scale-95 cursor-pointer">
        <i class="fa-solid fa-wand-magic-sparkles text-sm"></i><span>פתרון מלא</span>
      </button>

      <button id="btnCheckLines" class="w-full py-3 rounded-xl bg-gradient-to-b from-sky-500 to-sky-600 text-white font-extrabold text-xs shadow-lg flex flex-col items-center justify-center gap-1 active:scale-95 cursor-pointer">
        <i class="fa-solid fa-list-check text-sm"></i><span>בדוק שורות</span>
      </button>

      <button id="btnToPrint" class="w-full py-3 rounded-xl bg-gradient-to-b from-emerald-600 to-emerald-700 text-white font-extrabold text-xs shadow-lg flex flex-col items-center justify-center gap-1 active:scale-95 cursor-pointer">
        <i class="fa-solid fa-font text-sm"></i><span>לדפוס</span>
      </button>

      <button id="btnExportPdf" class="w-full py-2 rounded-xl bg-rose-50 text-rose-600 border border-rose-200 font-bold text-[11px] flex flex-col items-center justify-center gap-1 active:scale-95 cursor-pointer mt-2">
        <i class="fa-solid fa-file-pdf"></i><span>ל-PDF</span>
      </button>
    </div>
  </aside>

  <div id="pdfModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl text-center space-y-4">
      <div class="w-16 h-16 bg-rose-100 text-rose-600 rounded-2xl mx-auto flex items-center justify-center text-3xl">
        <i class="fa-solid fa-file-pdf"></i>
      </div>
      <h3 class="text-xl font-bold text-slate-800">יצוא תרגיל ל-PDF</h3>
      <p class="text-sm text-slate-500">תרגיל ארוך יתחלק לכמה עמודים.</p>
      <button id="btnConfirmPdf" class="w-full py-3.5 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl shadow-md flex items-center justify-center gap-2 cursor-pointer">
        <i class="fa-solid fa-download"></i><span>שמור PDF</span>
      </button>
      <button id="btnClosePdf" class="w-full py-2 text-slate-500 font-semibold cursor-pointer">חזור</button>
    </div>
  </div>

  <div id="aiModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-50 flex items-center justify-center hidden p-4 sm:p-8">
    <div class="bg-white rounded-3xl w-full max-w-2xl max-h-[90vh] flex flex-col shadow-2xl">
      <div class="p-5 border-b border-slate-200 flex justify-between items-center bg-indigo-50 rounded-t-3xl">
        <h3 class="text-xl font-bold text-indigo-900 flex items-center gap-2">
          <i class="fa-solid fa-robot text-indigo-600"></i> תשובת המערכת
        </h3>
        <button id="btnCloseAiModal" class="text-slate-500 hover:bg-slate-200 p-2 rounded-full w-10 h-10 flex items-center justify-center transition-colors cursor-pointer">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>
      <div class="p-6 overflow-y-auto flex-1">
        <div id="aiLoading" class="flex flex-col items-center justify-center py-10 hidden">
          <i class="fa-solid fa-circle-notch fa-spin text-4xl text-indigo-600 mb-4"></i>
          <p class="text-slate-600 font-medium">המערכת קוראת את התרגיל...</p>
        </div>
        <div id="aiContent" class="solution-content text-slate-800 hidden"></div>
      </div>
    </div>
  </div>

  <div id="settingsModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl space-y-4">
      <h3 class="text-lg font-bold text-slate-800 text-center border-b pb-2">הגדרות חיבור AI</h3>
      <p class="text-sm text-slate-600">הדבק כאן את מפתח ה-Gemini API שלך (הוא נשמר רק בטאבלט שלך):</p>
      <input type="text" id="apiKeyInput" placeholder="הדבק מפתח כאן..." class="w-full border border-slate-300 rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none dir-ltr font-mono">
      <div class="flex gap-2 pt-2">
        <button id="btnSaveApi" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md cursor-pointer">שמור</button>
        <button id="btnCancelApi" class="px-4 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl cursor-pointer">ביטול</button>
      </div>
    </div>
  </div>

  <script>
    const GEMINI_MODEL = 'gemini-3.8-flash';
    const PRINT_PROMPT = "תמלל את כתב היד שבתמונה לטקסט דפוס נקי, בדיוק כפי שנכתב, שורה אחרי שורה. אל תפתור, אל תתקן ואל תוסיף הסברים. כתוב ביטויים מתמטיים בטקסט רגיל עם סימנים כמו ², √, ×, ÷, ≤, ≥ ושברים בצורת (א)/(ב). אם משהו לא קריא, סמן אותו ב-[?]. החזר רק את התמלול.";

    const canvas = document.getElementById('drawingCanvas');
    const ctx = canvas.getContext('2d');
    const scroller = document.getElementById('scroller');

    let isDrawing = false;
    let activePointerId = null;
    let penModeOnly = true;
    let tool = 'pen';
    let strokeColor = '#0f172a';
    let strokeWidth = 1.5;
    let strokes = [];
    let currentStroke = [];
    let logicalHeight = 0;   // גובה הלוח בפיקסלי CSS
    const ERASER_WIDTH = 26;

    // ---------- הגדרות ----------
    const settingsModal = document.getElementById('settingsModal');
    const apiKeyInput = document.getElementById('apiKeyInput');
    function storageGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
    function storageSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

    document.getElementById('btnSettings').addEventListener('click', () => {
      apiKeyInput.value = storageGet('geminiApiKey') || '';
      settingsModal.classList.remove('hidden');
    });
    document.getElementById('btnSaveApi').addEventListener('click', () => {
      storageSet('geminiApiKey', apiKeyInput.value.trim());
      settingsModal.classList.add('hidden');
    });
    document.getElementById('btnCancelApi').addEventListener('click', () => settingsModal.classList.add('hidden'));

    // ---------- גודל הלוח ----------
    function setupCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const w = scroller.clientWidth;
      if (!logicalHeight) logicalHeight = scroller.clientHeight * 3; // שלושה מסכים בהתחלה
      logicalHeight = Math.max(logicalHeight, scroller.clientHeight);
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(logicalHeight * dpr);
      canvas.style.width = w + 'px';
      canvas.style.height = logicalHeight + 'px';
      redraw();
    }
    function extendBoard(by) {
      logicalHeight += by || scroller.clientHeight * 2;
      setupCanvas();
    }
    window.addEventListener('resize', setupCanvas);
    window.addEventListener('load', setupCanvas);
    setTimeout(setupCanvas, 50);

    // ---------- ציור ----------
    function drawSegment(a, b, t, color, width) {
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      if (t === 'eraser') {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.lineWidth = ERASER_WIDTH;
      } else {
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = color;
        ctx.lineWidth = width * (0.6 + (b.pressure || 0.5) * 0.8);
      }
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }

    function redraw() {
      const dpr = window.devicePixelRatio || 1;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalCompositeOperation = 'source-over';
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      strokes.forEach(stroke => {
        for (let i = 0; i < stroke.length; i++) {
          const p = stroke[i];
          drawSegment(stroke[Math.max(i - 1, 0)], p, p.tool, p.color, p.width);
        }
      });
      ctx.globalCompositeOperation = 'source-over';
    }

    // ---------- מלבן סימון תרגיל ----------
    let selectMode = false, selRect = null, selDrag = null;
    const selBox = document.getElementById('selBox');
    const btnSelect = document.getElementById('btnSelect');
    const btnSelectText = document.getElementById('btnSelectText');

    function showSel(r) {
      selBox.style.left = r.x + 'px'; selBox.style.top = r.y + 'px';
      selBox.style.width = r.w + 'px'; selBox.style.height = r.h + 'px';
      selBox.classList.remove('hidden');
    }
    function refreshSelUI() {
      btnSelectText.textContent = selRect ? 'בטל סימון' : (selectMode ? 'גרור על הלוח' : 'סמן תרגיל');
      btnSelect.classList.toggle('bg-indigo-100', selectMode || !!selRect);
      btnSelect.classList.toggle('border-indigo-600', selectMode || !!selRect);
    }
    function rectFrom(a, b) {
      const maxX = canvas.clientWidth, maxY = logicalHeight;
      const x1 = Math.max(0, Math.min(maxX, Math.min(a.x, b.x)));
      const x2 = Math.max(0, Math.min(maxX, Math.max(a.x, b.x)));
      const y1 = Math.max(0, Math.min(maxY, Math.min(a.y, b.y)));
      const y2 = Math.max(0, Math.min(maxY, Math.max(a.y, b.y)));
      return { x: x1, y: y1, w: x2 - x1, h: y2 - y1 };
    }
    function renderRegion(r) {
      const dpr = window.devicePixelRatio || 1;
      const t = document.createElement('canvas');
      t.width = Math.max(1, Math.round(r.w * dpr));
      t.height = Math.max(1, Math.round(r.h * dpr));
      const c = t.getContext('2d');
      c.fillStyle = '#ffffff';
      c.fillRect(0, 0, t.width, t.height);
      c.drawImage(canvas, r.x * dpr, r.y * dpr, r.w * dpr, r.h * dpr, 0, 0, t.width, t.height);
      return t;
    }
    btnSelect.addEventListener('click', () => {
      if (selRect) { selRect = null; selBox.classList.add('hidden'); selectMode = false; }
      else selectMode = !selectMode;
      refreshSelUI();
    });

    // ---------- גלילה ידנית באצבע ----------
    const touches = new Map(); // pointerId -> {y}
    let scrollingPointer = null;
    let scrollStartY = 0, scrollStartTop = 0;

    function startTouchScroll(e) {
      scrollingPointer = e.pointerId;
      scrollStartY = e.clientY;
      scrollStartTop = scroller.scrollTop;
    }

    function isPenLike(e) {
      return e.pointerType === 'pen' || e.pointerType === 'mouse';
    }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect(); // כולל את מיקום הגלילה
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    function startStroke(e) {
      isDrawing = true;
      activePointerId = e.pointerId;
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
      const pos = getPos(e);
      const pressure = (e.pressure && e.pressure > 0) ? e.pressure : 0.5;
      const p = { x: pos.x, y: pos.y, tool, color: strokeColor, width: strokeWidth, pressure };
      currentStroke = [p];
      drawSegment(p, p, p.tool, p.color, p.width); // נקודה בלחיצה בודדת
    }

    function endStroke(cancel) {
      if (isDrawing && currentStroke.length > 0 && !cancel) {
        strokes.push(currentStroke.slice());
        const maxY = Math.max(...currentStroke.map(p => p.y));
        if (maxY > logicalHeight - scroller.clientHeight * 0.5) extendBoard();
      } else if (isDrawing && cancel) {
        redraw();
      }
      isDrawing = false;
      activePointerId = null;
      currentStroke = [];
    }

    canvas.addEventListener('pointerdown', (e) => {
      if (selectMode && (isPenLike(e) || !penModeOnly)) {
        selDrag = { id: e.pointerId, start: getPos(e), rect: null };
        selRect = null;
        try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
        return;
      }
      if (e.pointerType === 'touch') {
        touches.set(e.pointerId, { y: e.clientY });
        if (penModeOnly) { startTouchScroll(e); return; }       // אצבע = גלילה
        if (touches.size >= 2) {                                // שתי אצבעות = גלילה
          if (isDrawing) endStroke(true);
          startTouchScroll(e);
          return;
        }
      }
      if (isDrawing) return;
      if (!isPenLike(e) && penModeOnly) return;
      startStroke(e);
    });

    canvas.addEventListener('pointermove', (e) => {
      if (selDrag && e.pointerId === selDrag.id) {
        selDrag.rect = rectFrom(selDrag.start, getPos(e));
        showSel(selDrag.rect);
        const sb = scroller.getBoundingClientRect();
        if (e.clientY > sb.bottom - 50) scroller.scrollTop += 14;
        else if (e.clientY < sb.top + 50) scroller.scrollTop -= 14;
        return;
      }
      if (scrollingPointer === e.pointerId) {
        scroller.scrollTop = scrollStartTop - (e.clientY - scrollStartY);
        return;
      }
      if (!isDrawing || e.pointerId !== activePointerId) return;
      const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
      (events.length ? events : [e]).forEach(ev => {
        const pos = getPos(ev);
        const pressure = (ev.pressure && ev.pressure > 0) ? ev.pressure : 0.5;
        const p = { x: pos.x, y: pos.y, tool, color: strokeColor, width: strokeWidth, pressure };
        drawSegment(currentStroke[currentStroke.length - 1], p, tool, strokeColor, strokeWidth);
        currentStroke.push(p);
      });
    });

    function onPointerEnd(e, cancel) {
      if (selDrag && e.pointerId === selDrag.id) {
        const r = selDrag.rect;
        selDrag = null;
        if (r && r.w > 30 && r.h > 30 && !cancel) { selRect = r; showSel(r); }
        else selBox.classList.add('hidden');
        selectMode = false;
        refreshSelUI();
        return;
      }
      if (e.pointerType === 'touch') {
        touches.delete(e.pointerId);
      }
      if (scrollingPointer === e.pointerId) scrollingPointer = null;
      if (isDrawing && e.pointerId === activePointerId) endStroke(cancel);
    }
    canvas.addEventListener('pointerup', (e) => onPointerEnd(e, false));
    canvas.addEventListener('pointercancel', (e) => onPointerEnd(e, true));
    canvas.addEventListener('lostpointercapture', (e) => {
      if (isDrawing && e.pointerId === activePointerId) endStroke(false);
    });

    // ---------- כלים ----------
    function selectPen() {
      tool = 'pen';
      btnPen.className = 'w-full py-2.5 rounded-xl bg-indigo-50 text-indigo-600 font-bold border-2 border-indigo-600 flex flex-col items-center gap-1 text-xs shadow-sm cursor-pointer';
      btnEraser.className = 'w-full py-2.5 rounded-xl text-slate-600 hover:bg-slate-100 font-medium flex flex-col items-center gap-1 text-xs transition-all cursor-pointer';
    }
    const btnPen = document.getElementById('btnPen');
    const btnEraser = document.getElementById('btnEraser');
    btnPen.addEventListener('click', selectPen);
    btnEraser.addEventListener('click', () => {
      tool = 'eraser';
      btnEraser.className = 'w-full py-2.5 rounded-xl bg-indigo-50 text-indigo-600 font-bold border-2 border-indigo-600 flex flex-col items-center gap-1 text-xs shadow-sm cursor-pointer';
      btnPen.className = 'w-full py-2.5 rounded-xl text-slate-600 hover:bg-slate-100 font-medium flex flex-col items-center gap-1 text-xs transition-all cursor-pointer';
    });

    document.querySelectorAll('.width-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        strokeWidth = parseFloat(btn.getAttribute('data-width'));
        document.querySelectorAll('.width-btn').forEach(b => b.classList.remove('border-2', 'border-indigo-600', 'bg-white', 'shadow-sm'));
        btn.classList.add('border-2', 'border-indigo-600', 'bg-white', 'shadow-sm');
        selectPen();
      });
    });

    document.querySelectorAll('.color-dot').forEach(dot => {
      dot.addEventListener('click', () => {
        strokeColor = dot.getAttribute('data-color');
        document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('ring-2', 'ring-offset-2', 'ring-indigo-600'));
        dot.classList.add('ring-2', 'ring-offset-2', 'ring-indigo-600');
        selectPen();
      });
    });

    document.getElementById('btnClear').addEventListener('click', () => { strokes = []; redraw(); });
    document.getElementById('btnUndo').addEventListener('click', () => { strokes.pop(); redraw(); });

    document.getElementById('btnScrollUp').addEventListener('click', () => scroller.scrollBy({ top: -scroller.clientHeight * 0.8, behavior: 'smooth' }));
    document.getElementById('btnScrollDown').addEventListener('click', () => {
      if (scroller.scrollTop + scroller.clientHeight * 1.8 > logicalHeight) extendBoard();
      scroller.scrollBy({ top: scroller.clientHeight * 0.8, behavior: 'smooth' });
    });
    document.getElementById('btnAddSpace').addEventListener('click', () => extendBoard());

    document.getElementById('togglePalm').addEventListener('click', () => {
      penModeOnly = !penModeOnly;
      document.getElementById('btnPalmText').textContent = penModeOnly ? 'עט בלבד' : 'עט + אצבע';
      document.getElementById('badgeStatusText').textContent = penModeOnly ? 'עט בלבד פעיל' : 'מגע אצבע פעיל';
    });

    // ---------- עזרי תמונה ----------
    function contentBottomPx() {
      // הנקודה הנמוכה ביותר שנכתב בה משהו (בפיקסלי CSS), עם שוליים
      let maxY = 0;
      strokes.forEach(s => { if (s[0].tool !== 'eraser') s.forEach(p => { if (p.y > maxY) maxY = p.y; }); });
      return Math.min(logicalHeight, maxY + 40);
    }
    function renderWhite(heightCss) {
      const dpr = window.devicePixelRatio || 1;
      const t = document.createElement('canvas');
      t.width = canvas.width;
      t.height = Math.max(1, Math.min(canvas.height, Math.ceil(heightCss * dpr)));
      const c = t.getContext('2d');
      c.fillStyle = '#ffffff';
      c.fillRect(0, 0, t.width, t.height);
      c.drawImage(canvas, 0, 0);
      return t;
    }

    // ---------- PDF (רב-עמודי) ----------
    const pdfModal = document.getElementById('pdfModal');
    document.getElementById('btnExportPdf').addEventListener('click', () => pdfModal.classList.remove('hidden'));
    document.getElementById('btnClosePdf').addEventListener('click', () => pdfModal.classList.add('hidden'));
    document.getElementById('btnConfirmPdf').addEventListener('click', () => {
      pdfModal.classList.add('hidden');
      if (!strokes.length) return;
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
      const margin = 10, pageW = 297, pageH = 210;
      const imgW = pageW - margin * 2, imgH = pageH - margin * 2;

      const full = renderWhite(contentBottomPx());
      const sliceH = Math.floor(full.width * imgH / imgW); // גובה פרוסה בפיקסלים ליחס הדף
      let y = 0, page = 0;
      while (y < full.height) {
        const h = Math.min(sliceH, full.height - y);
        const part = document.createElement('canvas');
        part.width = full.width; part.height = h;
        const pc = part.getContext('2d');
        pc.fillStyle = '#ffffff';
        pc.fillRect(0, 0, part.width, part.height);
        pc.drawImage(full, 0, y, full.width, h, 0, 0, full.width, h);
        if (page > 0) pdf.addPage();
        pdf.addImage(part.toDataURL('image/jpeg', 0.92), 'JPEG', margin, margin, imgW, h * imgW / full.width);
        y += h; page++;
      }
      pdf.save('math.pdf');
    });

    // ---------- בינה מלאכותית ----------
    const aiModal = document.getElementById('aiModal');
    const aiLoading = document.getElementById('aiLoading');
    const aiContent = document.getElementById('aiContent');
    document.getElementById('btnCloseAiModal').addEventListener('click', () => aiModal.classList.add('hidden'));

    function showMessage(node) {
      aiContent.replaceChildren(node);
      aiContent.classList.remove('hidden');
    }
    function box(cls, title, body, mono) {
      const d = document.createElement('div');
      d.className = cls;
      const h = document.createElement('h4');
      h.className = 'font-bold mb-2';
      h.textContent = title;
      const p = document.createElement(mono ? 'code' : 'p');
      p.className = mono ? 'text-sm font-mono block' : '';
      p.textContent = body;
      d.append(h, p);
      return d;
    }

    async function analyzeCanvas(mode) {
      const apiKey = storageGet('geminiApiKey');
      if (!apiKey) { settingsModal.classList.remove('hidden'); return; }

      aiModal.classList.remove('hidden');
      aiContent.classList.add('hidden');
      aiLoading.classList.add('hidden');

      if (strokes.length === 0) {
        showMessage(box('text-center p-6 bg-amber-50 rounded-xl border border-amber-200 text-amber-800',
          'הלוח שלך עדיין ריק', 'כתוב תרגיל מתמטי על הלוח לפני שתבקש מהמערכת לפתור אותו.'));
        return;
      }

      // שולחים רק את האזור שנכתב בו משהו
      const img = selRect ? renderRegion(selRect) : renderWhite(contentBottomPx());
      const MAX_SIDE = 2000;
      const sc = Math.min(1, MAX_SIDE / Math.max(img.width, img.height));
      let small = img;
      if (sc < 1) {
        small = document.createElement('canvas');
        small.width = Math.round(img.width * sc);
        small.height = Math.round(img.height * sc);
        small.getContext('2d').drawImage(img, 0, 0, small.width, small.height);
      }
      const base64Image = small.toDataURL('image/jpeg', 0.7).split(',')[1];

      const promptText = mode === 'full'
        ? "אתה מורה למתמטיקה. קרא את התרגיל שבתמונה, תאר מה כתוב, ואז פתור אותו שלב-אחר-שלב בעברית בצורה ברורה."
        : "אתה מורה למתמטיקה. בדוק את השלבים שהתלמיד כתב בתמונה. אל תתן את הפתרון המלא, אלא רק אמור לו האם מה שכתב עד עכשיו נכון, ותן לו רמז קטן להמשך (בעברית).";

      aiLoading.classList.remove('hidden');
      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey },
          body: JSON.stringify({
            contents: [{ parts: [{ text: mode === 'print' ? PRINT_PROMPT : promptText }, { inlineData: { mimeType: 'image/jpeg', data: base64Image } }] }],
            generationConfig: { thinkingConfig: { thinkingLevel: 'low' } }
          })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error?.message || 'שגיאת שרת לא ידועה');
        const text = (data.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('');
        if (!text) throw new Error('לא התקבלה תשובה מהמודל');
        aiContent.textContent = text; // טקסט בלבד, ללא HTML
        if (mode === 'print') {
          const copy = document.createElement('button');
          copy.className = 'block mt-4 px-4 py-2 bg-indigo-600 text-white font-bold rounded-xl text-sm cursor-pointer';
          copy.textContent = 'העתק טקסט';
          copy.addEventListener('click', async () => {
            try { await navigator.clipboard.writeText(text); copy.textContent = 'הועתק'; }
            catch (err) { copy.textContent = 'ההעתקה לא זמינה, סמן ידנית'; }
          });
          aiContent.appendChild(copy);
        }
        aiContent.classList.remove('hidden');
      } catch (error) {
        const wrap = box('bg-red-50 p-4 rounded-xl border border-red-200 text-red-700',
          'השגיאה שחזרה מגוגל:', error.message, true);
        const hint = document.createElement('p');
        hint.className = 'text-sm text-red-800 mt-3';
        hint.textContent = "לחץ על 'חיבור AI' ובדוק שהמפתח תקין.";
        wrap.appendChild(hint);
        showMessage(wrap);
      } finally {
        aiLoading.classList.add('hidden');
      }
    }

    // ---------- בדיקת שורות מקומית + הדגמה ----------
    const LINES_PROMPT = "תמלל את כל השורות המתמטיות שבתמונה, שורה אחת בכל שורת פלט, לפי הסדר מלמעלה למטה. העתק בדיוק מה שנכתב, כולל טעויות, ואל תפתור ואל תתקן. כתוב בתחביר מחשב: כפל עם *, חזקה עם ^, שבר עם /, שורש sqrt(), סוגריים מפורשים. דלג על טקסט מילולי וכותרות. החזר רק את השורות.";
    const DEMO_PROMPT = "אתה מורה למתמטיקה. לכל זוג מתחת, התלמיד כתב את השורה 'שגויה' אחרי 'קודמת', והיא אינה שקולה לקודמת. לכל זוג ענה בפורמט: [מספר] ואז שורה 'כך נכון: <השורה הנכונה>' ואז משפט או שניים בעברית שמסבירים מה הטעות ואיך מגיעים לשורה הנכונה. כתוב ביטויים בטקסט רגיל. החזר רק את התשובות.";
    const SAMPLE_VALS = [-3.7, -1.3, 0.6, 1.9, 2.4, 3.3, 5.1, -0.45, 7.2, -2.2];

    function normalizeLine(s) {
      return s.replace(/[−–—]/g, '-').replace(/[×·]/g, '*').replace(/÷/g, '/')
        .replace(/²/g, '^2').replace(/³/g, '^3')
        .replace(/√\s*\(/g, 'sqrt(').replace(/√\s*([A-Za-z0-9.]+)/g, 'sqrt($1)')
        .replace(/^[\s\-*•\d]+[.)]\s+/, '').trim();
    }
    function parseLine(raw) {
      const s = normalizeLine(raw);
      if (!s) return null;
      const parts = s.split('=');
      try {
        if (parts.length === 2) return { raw: s, type: 'eq', l: math.parse(parts[0]), r: math.parse(parts[1]) };
        if (parts.length === 1) return { raw: s, type: 'ex', e: math.parse(s) };
      } catch (err) {}
      return null;
    }
    function nodesOf(p) { return p.type === 'ex' ? [p.e] : [p.l, p.r]; }
    function varsOf(node) {
      const v = new Set();
      node.traverse((n, path) => { if (n.isSymbolNode && path !== 'fn' && !(n.name in math)) v.add(n.name); });
      return v;
    }
    function evalNum(node, scope) {
      try { const v = node.evaluate(Object.assign({}, scope)); return (typeof v === 'number' && isFinite(v)) ? v : null; }
      catch (e) { return null; }
    }
    // true = שקולות, false = לא שקולות, null = לא ניתן לבדוק
    function sameLine(a, b) {
      if (a.type !== b.type) return null;
      const vars = new Set();
      [...nodesOf(a), ...nodesOf(b)].forEach(n => varsOf(n).forEach(x => vars.add(x)));
      const names = [...vars];
      const diffs = []; let valid = 0;
      for (let t = 0; t < 14 && valid < 8; t++) {
        const scope = {};
        names.forEach((nm, k) => { scope[nm] = SAMPLE_VALS[(t + k * 4) % SAMPLE_VALS.length]; });
        if (a.type === 'ex') {
          const u = evalNum(a.e, scope), w = evalNum(b.e, scope);
          if (u === null || w === null) continue;
          valid++;
          if (Math.abs(u - w) > 1e-6 * (1 + Math.abs(u) + Math.abs(w))) return false;
        } else {
          const u = evalNum(a.l, scope), u2 = evalNum(a.r, scope), w = evalNum(b.l, scope), w2 = evalNum(b.r, scope);
          if ([u, u2, w, w2].some(v => v === null)) continue;
          valid++;
          diffs.push([u - u2, w - w2]);
        }
      }
      if (valid < 3) return null;
      if (a.type === 'ex') return true;
      // משוואות: ההפרשים חייבים להיות ביחס קבוע שאינו אפס
      let k = null;
      for (const [f1, f2] of diffs) {
        const z1 = Math.abs(f1) < 1e-9, z2 = Math.abs(f2) < 1e-9;
        if (z1 && z2) continue;
        if (z1 || z2) return false;
        const r = f1 / f2;
        if (k === null) k = r; else if (Math.abs(r - k) > 1e-6 * (1 + Math.abs(k))) return false;
      }
      return k === null ? null : true;
    }

    async function geminiCall(parts) {
      const apiKey = storageGet('geminiApiKey');
      if (!apiKey) throw new Error("חסר מפתח, לחץ על 'חיבור AI'");
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey },
        body: JSON.stringify({ contents: [{ parts }], generationConfig: { thinkingConfig: { thinkingLevel: 'low' } } })
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error?.message || 'שגיאת שרת לא ידועה');
      const text = (data.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('');
      if (!text) throw new Error('לא התקבלה תשובה מהמודל');
      return text;
    }
    function boardImageB64() {
      const img = selRect ? renderRegion(selRect) : renderWhite(contentBottomPx());
      const sc = Math.min(1, 2000 / Math.max(img.width, img.height));
      let small = img;
      if (sc < 1) {
        small = document.createElement('canvas');
        small.width = Math.round(img.width * sc);
        small.height = Math.round(img.height * sc);
        small.getContext('2d').drawImage(img, 0, 0, small.width, small.height);
      }
      return small.toDataURL('image/jpeg', 0.7).split(',')[1];
    }
    function el(tag, cls, text) {
      const n = document.createElement(tag);
      n.className = cls || '';
      if (text != null) n.textContent = text;
      return n;
    }

    async function checkLines() {
      aiModal.classList.remove('hidden');
      aiContent.classList.add('hidden');
      aiLoading.classList.add('hidden');
      if (!storageGet('geminiApiKey')) { aiModal.classList.add('hidden'); settingsModal.classList.remove('hidden'); return; }
      if (!window.math) {
        showMessage(box('p-4 bg-red-50 rounded-xl border border-red-200 text-red-700', 'שגיאה', 'ספריית המתמטיקה לא נטענה. בדוק חיבור לאינטרנט ורענן את הדף.'));
        return;
      }
      if (!strokes.length) {
        showMessage(box('text-center p-6 bg-amber-50 rounded-xl border border-amber-200 text-amber-800', 'הלוח שלך עדיין ריק', 'כתוב כמה שורות פתרון לפני הבדיקה.'));
        return;
      }
      aiLoading.classList.remove('hidden');
      try {
        const raw = await geminiCall([{ text: LINES_PROMPT }, { inlineData: { mimeType: 'image/jpeg', data: boardImageB64() } }]);
        const lines = raw.split('\n').map(s => s.trim()).filter(Boolean);
        const rows = []; let prev = null;
        lines.forEach(line => {
          const p = parseLine(line);
          const row = { text: line, status: 'na', prev: null };
          if (p && prev) {
            const same = sameLine(prev, p);
            if (same === true) row.status = 'ok';
            else if (same === false) { row.status = 'bad'; row.prev = prev.raw; }
          }
          if (p) prev = p;
          rows.push(row);
        });

        const bad = rows.filter(r => r.status === 'bad');
        const demos = {};
        if (bad.length) {
          const pairs = bad.map((r, i) => {
            let hint = '';
            try { const pp = parseLine(r.prev); if (pp && pp.type === 'ex') hint = ' | פישוט אוטומטי של הקודמת: ' + math.simplify(pp.e).toString(); } catch (e) {}
            return `[${i + 1}] קודמת: ${r.prev} | שגויה: ${r.text}${hint}`;
          }).join('\n');
          const out = await geminiCall([{ text: DEMO_PROMPT + '\n' + pairs }]);
          const re = /\[(\d+)\]\s*([\s\S]*?)(?=\[\d+\]|$)/g; let m;
          while ((m = re.exec(out))) demos[m[1]] = m[2].trim();
          if (!Object.keys(demos).length) demos['1'] = out;
        }

        const wrap = el('div', 'space-y-2');
        wrap.appendChild(el('p', 'font-bold text-lg mb-2', bad.length ? `נמצאו ${bad.length} שורות שגויות` : 'כל השורות שנבדקו תקינות'));
        let bi = 0;
        rows.forEach(r => {
          const bg = r.status === 'bad' ? 'bg-red-50 border-red-200' : (r.status === 'ok' ? 'bg-emerald-50 border-emerald-200' : 'bg-slate-50 border-slate-200');
          const box1 = el('div', 'p-3 rounded-xl border ' + bg);
          const head = el('div', 'flex items-center gap-3');
          const mark = el('span', 'font-black text-xl ' + (r.status === 'bad' ? 'text-red-600' : r.status === 'ok' ? 'text-emerald-600' : 'text-slate-400'), r.status === 'bad' ? '✗' : r.status === 'ok' ? '✓' : '•');
          const txt = el('span', 'font-mono text-base', r.text);
          txt.dir = 'ltr';
          head.append(mark, txt);
          box1.appendChild(head);
          if (r.status === 'bad') {
            bi++;
            box1.appendChild(el('div', 'mt-2 p-3 bg-white border border-emerald-300 rounded-lg text-emerald-900', demos[String(bi)] || 'לא התקבלה הדגמה לשורה הזו.'));
          }
          wrap.appendChild(box1);
        });
        wrap.appendChild(el('p', 'text-xs text-slate-500 pt-2', "הבדיקה מקומית ומספרית. שורות עם '•' לא נבדקו (שורה ראשונה, טקסט מילולי או ביטוי שלא נקרא)."));
        showMessage(wrap);
      } catch (error) {
        showMessage(box('bg-red-50 p-4 rounded-xl border border-red-200 text-red-700', 'שגיאה:', error.message, true));
      } finally {
        aiLoading.classList.add('hidden');
      }
    }
    document.getElementById('btnCheckLines').addEventListener('click', checkLines);

    document.getElementById('btnCheckFull').addEventListener('click', () => analyzeCanvas('full'));
    document.getElementById('btnCheckSteps').addEventListener('click', () => analyzeCanvas('steps'));
    document.getElementById('btnToPrint').addEventListener('click', () => analyzeCanvas('print'));
  </script>
</body>
</html>
