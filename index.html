<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>לוח מתמטיקה חכם לטאבלט</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="לוח מתמטיקה">
  <meta name="theme-color" content="#4f46e5">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; touch-action: none;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f8fafc;
    }
    .grid-math {
      background-size: 28px 28px;
      background-image: 
        linear-gradient(to right, rgba(99, 102, 241, 0.12) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(99, 102, 241, 0.12) 1px, transparent 1px);
      background-color: #f8fafc;
    }
    #drawingCanvas { touch-action: none; cursor: crosshair; }
    
    /* תצוגת פתרון */
    .solution-content { font-size: 1.1rem; line-height: 1.6; white-space: pre-wrap; }
  </style>
</head>
<body class="flex h-screen w-screen overflow-hidden select-none bg-slate-900 text-slate-800">

  <!-- משטח הכתיבה הראשי -->
  <main class="relative flex-1 h-full overflow-hidden grid-math" id="canvasContainer">
    <canvas id="drawingCanvas" class="w-full h-full block"></canvas>
    
    <div id="palmFloatingBadge" class="absolute top-4 left-4 z-20 bg-white/90 backdrop-blur px-3 py-1.5 rounded-2xl shadow-md border border-slate-200 flex items-center gap-2 pointer-events-none text-xs font-semibold text-emerald-700">
      <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
      <span id="badgeStatusText">עט בלבד פעיל</span>
    </div>
  </main>

  <!-- סרגל כלים צידי אנכי -->
  <aside id="sidebar" class="w-20 md:w-24 bg-white border-r border-slate-200 h-full flex flex-col justify-between items-center py-4 px-2 shadow-2xl z-40 overflow-y-auto">
    
    <div class="flex flex-col items-center gap-3 w-full">
      <div class="w-12 h-12 rounded-2xl bg-indigo-600 text-white flex items-center justify-center font-black text-xl shadow-md">∑</div>

      <!-- עט ומחק -->
      <div class="flex flex-col gap-2 w-full pt-1">
        <button id="btnPen" class="w-full py-2.5 rounded-xl bg-indigo-50 text-indigo-600 font-bold border-2 border-indigo-600 flex flex-col items-center gap-1 text-xs shadow-sm">
          <i class="fa-solid fa-pen text-base"></i><span>עט</span>
        </button>
        <button id="btnEraser" class="w-full py-2.5 rounded-xl text-slate-600 hover:bg-slate-100 font-medium flex flex-col items-center gap-1 text-xs transition-all">
          <i class="fa-solid fa-eraser text-base"></i><span>מחק</span>
        </button>
      </div>

      <!-- הגדרות API -->
      <button id="btnSettings" class="w-full py-2 mt-1 rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 flex flex-col items-center gap-1 text-[10px] font-bold border border-slate-300">
        <i class="fa-solid fa-gear text-sm"></i>
        <span>חיבור AI</span>
      </button>

      <!-- מתג דחיית כף יד -->
      <button id="togglePalm" class="w-full py-2 px-1 rounded-xl bg-emerald-50 text-emerald-700 border border-emerald-300 flex flex-col items-center gap-1 text-[11px] font-bold mt-1">
        <i class="fa-solid fa-hand text-sm"></i>
        <span id="btnPalmText">עט בלבד</span>
      </button>

      <div class="flex items-center gap-2 pt-1 w-full justify-center">
        <button id="btnUndo" class="p-2 text-slate-600 hover:bg-slate-100 rounded-xl"><i class="fa-solid fa-rotate-left"></i></button>
        <button id="btnClear" class="p-2 text-rose-500 hover:bg-rose-50 rounded-xl"><i class="fa-solid fa-trash-can"></i></button>
      </div>
    </div>

    <!-- כפתורי פעולה לאנליזה -->
    <div class="flex flex-col items-center gap-2.5 w-full pt-2 border-t border-slate-200">
      
      <button id="btnCheckSteps" class="w-full py-3 rounded-2xl bg-gradient-to-b from-amber-500 to-amber-600 text-white font-extrabold text-xs shadow-lg flex flex-col items-center justify-center gap-1 active:scale-95">
        <i class="fa-solid fa-magnifying-glass text-lg"></i>
        <span>בדוק שלבים</span>
      </button>

      <button id="btnCheckFull" class="w-full py-3 rounded-2xl bg-gradient-to-b from-indigo-600 to-indigo-700 text-white font-black text-xs shadow-lg flex flex-col items-center justify-center gap-1 active:scale-95">
        <i class="fa-solid fa-wand-magic-sparkles text-lg"></i>
        <span>פתור עכשיו</span>
      </button>

    </div>
  </aside>

  <!-- חלון פתרון התרגיל (AI Modal) -->
  <div id="aiModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-50 flex items-center justify-center hidden p-4 sm:p-8">
    <div class="bg-white rounded-3xl w-full max-w-2xl max-h-full flex flex-col shadow-2xl">
      <div class="p-5 border-b border-slate-200 flex justify-between items-center bg-indigo-50 rounded-t-3xl">
        <h3 class="text-xl font-bold text-indigo-900 flex items-center gap-2">
          <i class="fa-solid fa-robot text-indigo-600"></i> תשובת המערכת
        </h3>
        <button id="btnCloseAiModal" class="text-slate-500 hover:bg-slate-200 p-2 rounded-full w-10 h-10 flex items-center justify-center transition-colors">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>
      <div class="p-6 overflow-y-auto flex-1">
        <!-- מסך טעינה -->
        <div id="aiLoading" class="flex flex-col items-center justify-center py-10 hidden">
          <i class="fa-solid fa-circle-notch fa-spin text-4xl text-indigo-600 mb-4"></i>
          <p class="text-slate-600 font-medium">המערכת מפענחת את כתב היד שלך...</p>
        </div>
        <!-- תוכן הפתרון -->
        <div id="aiContent" class="solution-content text-slate-800 hidden"></div>
      </div>
    </div>
  </div>

  <!-- חלון הגדרות מפתח API -->
  <div id="settingsModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl space-y-4">
      <h3 class="text-lg font-bold text-slate-800">הגדרות חיבור AI</h3>
      <p class="text-sm text-slate-600">כדי שהאפליקציה תפתור תרגילים, עליך להזין מפתח חינמי של Gemini API. המפתח נשמר רק במכשיר שלך.</p>
      <input type="text" id="apiKeyInput" placeholder="הדבק כאן את מפתח ה-API שלך..." class="w-full border border-slate-300 rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none dir-ltr font-mono">
      <div class="flex gap-2 pt-2">
        <button id="btnSaveApi" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md">שמור</button>
        <button id="btnCancelApi" class="px-4 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl">ביטול</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('drawingCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvasContainer');

    let isDrawing = false;
    let penModeOnly = true;
    let tool = 'pen';
    let strokeColor = '#0f172a';
    let strokeWidth = 2;
    let strokes = [];
    let currentStroke = [];

    // ניהול מפתח API
    const settingsModal = document.getElementById('settingsModal');
    const apiKeyInput = document.getElementById('apiKeyInput');
    
    document.getElementById('btnSettings').addEventListener('click', () => {
      apiKeyInput.value = localStorage.getItem('geminiApiKey') || '';
      settingsModal.classList.remove('hidden');
    });
    
    document.getElementById('btnSaveApi').addEventListener('click', () => {
      localStorage.setItem('geminiApiKey', apiKeyInput.value.trim());
      settingsModal.classList.add('hidden');
    });
    
    document.getElementById('btnCancelApi').addEventListener('click', () => {
      settingsModal.classList.add('hidden');
    });

    // ציור
    function resizeCanvas() {
      const rect = container.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      redraw();
    }
    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('load', resizeCanvas);
    setTimeout(resizeCanvas, 50);

    function isPen(e) {
      if (!penModeOnly) return true;
      return e.pointerType === 'pen' || e.pointerType === 'mouse';
    }

    canvas.addEventListener('pointerdown', (e) => {
      if (!isPen(e)) return;
      isDrawing = true;
      const rect = canvas.getBoundingClientRect();
      currentStroke = [{ x: e.clientX - rect.left, y: e.clientY - rect.top, tool }];
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!isDrawing || !isPen(e)) return;
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      currentStroke.push({ x, y, tool });

      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      if (tool === 'eraser') {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.lineWidth = 30;
      } else {
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = strokeColor;
        ctx.lineWidth = strokeWidth;
      }
      const prev = currentStroke[currentStroke.length - 2];
      ctx.beginPath();
      ctx.moveTo(prev.x, prev.y);
      ctx.lineTo(x, y);
      ctx.stroke();
    });

    canvas.addEventListener('pointerup', () => {
      if (isDrawing && currentStroke.length > 0) strokes.push([...currentStroke]);
      isDrawing = false;
    });

    function redraw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      strokes.forEach(stroke => {
        if (!stroke.length) return;
        ctx.beginPath();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        if (stroke[0].tool === 'eraser') {
          ctx.globalCompositeOperation = 'destination-out';
          ctx.lineWidth = 30;
        } else {
          ctx.globalCompositeOperation = 'source-over';
          ctx.strokeStyle = strokeColor;
          ctx.lineWidth = strokeWidth;
        }
        ctx.moveTo(stroke[0].x, stroke[0].y);
        for (let i = 1; i < stroke.length; i++) ctx.lineTo(stroke[i].x, stroke[i].y);
        ctx.stroke();
      });
    }

    // סרגלי כלים
    const btnPen = document.getElementById('btnPen');
    const btnEraser = document.getElementById('btnEraser');
    btnPen.addEventListener('click', () => {
      tool = 'pen';
      btnPen.className = 'w-full py-2.5 rounded-xl bg-indigo-50 text-indigo-600 font-bold border-2 border-indigo-600 flex flex-col items-center gap-1 text-xs shadow-sm';
      btnEraser.className = 'w-full py-2.5 rounded-xl text-slate-600 hover:bg-slate-100 font-medium flex flex-col items-center gap-1 text-xs transition-all';
    });
    btnEraser.addEventListener('click', () => {
      tool = 'eraser';
      btnEraser.className = 'w-full py-2.5 rounded-xl bg-indigo-50 text-indigo-600 font-bold border-2 border-indigo-600 flex flex-col items-center gap-1 text-xs shadow-sm';
      btnPen.className = 'w-full py-2.5 rounded-xl text-slate-600 hover:bg-slate-100 font-medium flex flex-col items-center gap-1 text-xs transition-all';
    });

    document.getElementById('btnClear').addEventListener('click', () => { strokes = []; redraw(); });
    document.getElementById('btnUndo').addEventListener('click', () => { strokes.pop(); redraw(); });

    const togglePalm = document.getElementById('togglePalm');
    togglePalm.addEventListener('click', () => {
      penModeOnly = !penModeOnly;
      document.getElementById('btnPalmText').textContent = penModeOnly ? 'עט בלבד' : 'עט + אצבע';
      document.getElementById('badgeStatusText').textContent = penModeOnly ? 'עט בלבד פעיל' : 'מגע אצבע פעיל';
    });

    // ----------------------------------------------------
    // ה"מוח": חיבור ל-Gemini Vision API
    // ----------------------------------------------------
    const aiModal = document.getElementById('aiModal');
    const aiLoading = document.getElementById('aiLoading');
    const aiContent = document.getElementById('aiContent');

    document.getElementById('btnCloseAiModal').addEventListener('click', () => {
      aiModal.classList.add('hidden');
    });

    async function analyzeCanvas(mode) {
      const apiKey = localStorage.getItem('geminiApiKey');
      if (!apiKey) {
        alert("חסר מפתח API! לחץ על כפתור ההגדרות (חיבור AI) בסרגל הצידי כדי להזין את המפתח שלך.");
        settingsModal.classList.remove('hidden');
        return;
      }

      if (strokes.length === 0) {
        alert("הלוח ריק, כתוב תרגיל קודם!");
        return;
      }

      // שמירת הלוח כתמונה בסיס 64
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = canvas.width; tempCanvas.height = canvas.height;
      const tCtx = tempCanvas.getContext('2d');
      tCtx.fillStyle = 'white'; tCtx.fillRect(0,0,tempCanvas.width,tempCanvas.height);
      tCtx.drawImage(canvas, 0, 0);
      
      const base64Image = tempCanvas.toDataURL('image/jpeg', 0.8).split(',')[1];
      
      const promptText = mode === 'full' 
        ? "אתה מורה למתמטיקה. קרא את התרגיל שבתמונה, תאר מה כתוב, ואז פתור אותו שלב-אחר-שלב בעברית בצורה ברורה."
        : "אתה מורה למתמטיקה. בדוק את השלבים שהתלמיד כתב בתמונה. אל תתן את הפתרון המלא, אלא רק אמור לו האם מה שכתב עד עכשיו נכון, ותן לו רמז קטן להמשך (בעברית).";

      aiModal.classList.remove('hidden');
      aiLoading.classList.remove('hidden');
      aiContent.classList.add('hidden');

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: promptText },
                { inlineData: { mimeType: "image/jpeg", data: base64Image } }
              ]
            }]
          })
        });

        if (!response.ok) throw new Error("שגיאה בחיבור. ייתכן שמפתח ה-API לא תקין.");
        
        const data = await response.json();
        const textResult = data.candidates[0].content.parts[0].text;
        
        aiContent.innerHTML = textResult; // תצוגת התשובה
        aiLoading.classList.add('hidden');
        aiContent.classList.remove('hidden');
        
      } catch (error) {
        aiLoading.classList.add('hidden');
        aiContent.classList.remove('hidden');
        aiContent.innerHTML = `<span style="color:red;">שגיאה: ${error.message}</span>`;
      }
    }

    document.getElementById('btnCheckFull').addEventListener('click', () => analyzeCanvas('full'));
    document.getElementById('btnCheckSteps').addEventListener('click', () => analyzeCanvas('steps'));
  </script>
</body>
</html>
