<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>לוח מתמטיקה חכם לטאבלט</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="לוח מתמטיקה">
  <meta name="theme-color" content="#4f46e5">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f8fafc;
    }
    .grid-math {
      background-size: 28px 28px;
      background-image: 
        linear-gradient(to right, rgba(99, 102, 241, 0.12) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(99, 102, 241, 0.12) 1px, transparent 1px);
      background-color: #f8fafc;
    }
    #drawingCanvas { 
      touch-action: none; 
      cursor: crosshair; 
      width: 100%; 
      height: 100%; 
      display: block; 
    }
    #sidebar, #sidebar button, .modal-interactive, .modal-interactive button {
      touch-action: auto !important;
      pointer-events: auto !important;
    }
  </style>
</head>
<body class="flex h-screen w-screen overflow-hidden select-none bg-slate-100 text-slate-800">

  <!-- משטח הכתיבה הראשי -->
  <main class="relative flex-1 h-full overflow-hidden grid-math" id="canvasContainer">
    <canvas id="drawingCanvas"></canvas>
    
    <!-- חיווי סטטוס עט/כף יד -->
    <div id="palmFloatingBadge" class="absolute top-4 left-4 z-20 bg-white/95 backdrop-blur px-3.5 py-1.5 rounded-2xl shadow border border-slate-200 flex items-center gap-2 pointer-events-none text-xs font-semibold text-emerald-700">
      <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
      <span id="badgeStatusText">עט בלבד פעיל (דחיית כף יד)</span>
    </div>

    <!-- כפתור מסך מלא -->
    <button id="btnFullscreen" class="absolute top-4 right-4 z-20 bg-white/90 backdrop-blur text-slate-700 hover:text-slate-900 w-10 h-10 rounded-2xl shadow border border-slate-200 flex items-center justify-center text-sm active:scale-95 transition-transform" title="מסך מלא">
      <i class="fa-solid fa-expand"></i>
    </button>
  </main>

  <!-- סרגל כלים צידי אנכי קבוע מימין -->
  <aside id="sidebar" class="w-20 md:w-24 bg-white border-r border-slate-200 h-full flex flex-col justify-between items-center py-3 px-2 shadow-xl z-40 relative">
    
    <!-- חלק עליון: לוגו, עט, מחק, עובי וצבעים -->
    <div class="flex flex-col items-center gap-2.5 w-full">
      <div class="w-11 h-11 rounded-2xl bg-indigo-600 text-white flex items-center justify-center font-black text-xl shadow-md shadow-indigo-600/30">
        ∑
      </div>

      <!-- כלי עט ומחק -->
      <div class="flex flex-col gap-1.5 w-full pt-1">
        <button id="btnPen" class="w-full py-2.5 rounded-xl bg-indigo-50 text-indigo-600 font-bold border-2 border-indigo-600 flex flex-col items-center justify-center gap-1 text-xs transition-all shadow-sm">
          <i class="fa-solid fa-pen text-base"></i>
          <span>עט</span>
        </button>
        <button id="btnEraser" class="w-full py-2.5 rounded-xl text-slate-600 hover:bg-slate-100 font-medium flex flex-col items-center justify-center gap-1 text-xs transition-all">
          <i class="fa-solid fa-eraser text-base"></i>
          <span>מחק</span>
        </button>
      </div>

      <!-- בורר עובי קו -->
      <div class="w-full bg-slate-100 rounded-xl p-1.5 flex flex-col items-center gap-1 border border-slate-200">
        <span class="text-[10px] text-slate-500 font-bold">עובי</span>
        <div class="flex items-center justify-around w-full">
          <button class="width-btn w-6 h-6 rounded-full flex items-center justify-center bg-white shadow-sm border-2 border-indigo-600" data-width="1.5" title="דק (1.5px)">
            <span class="w-1.5 h-1.5 rounded-full bg-slate-800"></span>
          </button>
          <button class="width-btn w-6 h-6 rounded-full flex items-center justify-center hover:bg-white" data-width="3.5" title="בינוני (3.5px)">
            <span class="w-2.5 h-2.5 rounded-full bg-slate-800"></span>
          </button>
          <button class="width-btn w-6 h-6 rounded-full flex items-center justify-center hover:bg-white" data-width="6" title="עבה (6px)">
            <span class="w-3.5 h-3.5 rounded-full bg-slate-800"></span>
          </button>
        </div>
      </div>

      <!-- צבעים -->
      <div class="grid grid-cols-2 gap-1.5 pt-1">
        <button class="color-dot w-7 h-7 rounded-full bg-slate-900 ring-2 ring-offset-2 ring-indigo-600 shadow-sm" data-color="#0f172a"></button>
        <button class="color-dot w-7 h-7 rounded-full bg-blue-600 shadow-sm" data-color="#2563eb"></button>
        <button class="color-dot w-7 h-7 rounded-full bg-emerald-600 shadow-sm" data-color="#059669"></button>
        <button class="color-dot w-7 h-7 rounded-full bg-rose-600 shadow-sm" data-color="#e11d48"></button>
      </div>

      <!-- מתג דחיית כף יד -->
      <button id="togglePalm" class="w-full py-2 px-1 rounded-xl bg-emerald-50 text-emerald-700 border border-emerald-300 flex flex-col items-center gap-0.5 text-[11px] font-bold mt-0.5" title="החלף מצב דחיית כף יד">
        <i class="fa-solid fa-hand text-xs"></i>
        <span id="btnPalmText">עט בלבד</span>
      </button>

      <!-- ביטול וניקוי -->
      <div class="flex items-center gap-1 pt-1">
        <button id="btnUndo" class="p-2 text-slate-600 hover:text-indigo-600 hover:bg-indigo-50 rounded-xl" title="בטל פעולה">
          <i class="fa-solid fa-rotate-left"></i>
        </button>
        <button id="btnClear" class="p-2 text-rose-500 hover:bg-rose-50 rounded-xl" title="נקה לוח">
          <i class="fa-solid fa-trash-can"></i>
        </button>
      </div>
    </div>

    <!-- חלק תחתון: PDF, בדיקת ביניים, פתרון מלא, והגדרות API -->
    <div class="flex flex-col items-center gap-2 w-full pt-2 border-t border-slate-200">
      
      <!-- הגדרות מפתח Gemini API -->
      <button id="btnApiKey" class="text-[11px] text-slate-400 hover:text-indigo-600 flex items-center gap-1 mb-1 font-medium" title="הגדר מפתח Gemini API לבדיקה">
        <i class="fa-solid fa-key"></i> מפתח
      </button>

      <!-- כפתור PDF אדום בולט -->
      <button id="btnExportPdf" class="w-full py-2.5 rounded-2xl bg-gradient-to-b from-rose-600 to-red-600 text-white font-black text-xs shadow-md shadow-rose-600/30 flex flex-col items-center justify-center gap-0.5 active:scale-95 transition-transform" title="שמור ושתף ב-PDF">
        <i class="fa-solid fa-file-pdf text-lg"></i>
        <span>PDF</span>
      </button>

      <!-- בדיקת ביניים -->
      <button id="btnCheckSteps" class="w-full py-2.5 rounded-2xl bg-gradient-to-b from-amber-500 to-amber-600 text-white font-extrabold text-xs shadow-md shadow-amber-500/30 flex flex-col items-center justify-center gap-0.5 active:scale-95 transition-transform" title="איך הפתרון עד פה?">
        <i class="fa-solid fa-magnifying-glass-chart text-base"></i>
        <span>איך עד פה?</span>
      </button>

      <!-- פתרון מלא -->
      <button id="btnCheckFull" class="w-full py-2.5 rounded-2xl bg-gradient-to-b from-indigo-600 to-indigo-700 text-white font-black text-xs shadow-md shadow-indigo-600/30 flex flex-col items-center justify-center gap-0.5 active:scale-95 transition-transform" title="פתרון ובדיקה מלאה">
        <i class="fa-solid fa-wand-magic-sparkles text-base"></i>
        <span>פתרון מלא</span>
      </button>
    </div>
  </aside>

  <!-- חלון יצוא ושיתוף PDF -->
  <div id="pdfModal" class="modal-interactive fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl text-center space-y-4">
      <div class="w-16 h-16 bg-rose-100 text-rose-600 rounded-2xl mx-auto flex items-center justify-center text-3xl">
        <i class="fa-solid fa-file-pdf"></i>
      </div>
      <h3 class="text-xl font-bold text-slate-800">יצוא תרגיל ל-PDF</h3>
      <p class="text-sm text-slate-600 leading-relaxed">המערכת מייצאת את התרגיל שכתבת כמסמך PDF נקי.</p>
      
      <button id="btnConfirmPdf" class="w-full py-3.5 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl shadow-md flex items-center justify-center gap-2">
        <i class="fa-solid fa-download"></i>
        <span>הורד / שתף PDF עכשיו</span>
      </button>

      <button id="btnClosePdf" class="text-slate-400 hover:text-slate-600 text-sm font-semibold pt-1">חזור ללוח</button>
    </div>
  </div>

  <!-- חלון הזנת מפתח Gemini API -->
  <div id="apiModal" class="modal-interactive fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl space-y-4 text-right">
      <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
        <i class="fa-solid fa-key text-indigo-600"></i>
        <span>הגדרת Gemini API לבדיקת תרגילים</span>
      </h3>
      <p class="text-xs text-slate-600 leading-relaxed">כדי שהאפליקציה תוכל לבדוק תרגילים בכתב יד, הזן מפתח חינמי מ-Google AI Studio (נשמר בטאבלט שלך בלבד):</p>
      <input type="password" id="inputApiKey" placeholder="הדבק כאן את מפתח ה-API (AIzaSy...)" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 text-sm font-mono text-left focus:outline-none focus:ring-2 focus:ring-indigo-500">
      <div class="flex gap-2">
        <button id="btnSaveApiKey" class="flex-1 py-2.5 bg-indigo-600 text-white rounded-xl text-sm font-bold">שמור מפתח</button>
        <button id="btnCloseApiModal" class="px-4 py-2.5 bg-slate-100 text-slate-700 rounded-xl text-sm font-semibold">סגור</button>
      </div>
    </div>
  </div>

  <!-- חלונית הצגת תוצאות הבדיקה (Ka
